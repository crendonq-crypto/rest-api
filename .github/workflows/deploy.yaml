name: deploy

on:
  push:
    branches: ["main"]

env:
  REGISTRY: crendonq
  IMAGE_NAME: rest_api

jobs:
  build:
    name: build image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Iniciar sesión en Docker Hub
        uses: docker/login-action@v3.3.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push 
        uses: docker/build-push-action@v5
        with:
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          build-args: |
            APP_ENV=${{ secrets.APP_ENV }}

  test:
    name: Run tests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: code
        uses: actions/checkout@v4
      - name: test
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm install
      - run: npm run test  
      #TEST7
    
  codeScan:
     name: SonarCloud Scan
     runs-on: ubuntu-latest
     needs: test
     steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN}}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: >
            -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }}    
      
      - name: Get SonarCloud status
        run: |
         echo "SONAR_STATUS=$(curl -s -u ${{ secrets.SONAR_TOKEN}}: https://sonarcloud.io/api/qualitygates/project_status?projectKey=${{ secrets.SONAR_PROJECT_KEY }} | jq -r '.projectStatus.status')" >> $GITHUB_ENV  

      - name: Sonar Status
        run: echo ${{ env.SONAR_STATUS }}

      - name: Check Status
        if: ${{ env.SONAR_STATUS == 'ERROR' }}
        run: echo "Sonar faling securidad"
      
  security-SNyK:
          name: snyk image scan
          needs: build
          runs-on: ubuntu-latest
          steps:
           - name: Run Snyk to check Docker image for vulnerabilities
             uses: snyk/actions/docker@master
             env:
              SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
             with:
              image: your/image-to-test    